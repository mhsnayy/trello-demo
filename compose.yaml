name: trello-demo

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Yerel ağa açıktır. Yalnızca bu bilgisayar için BIND_ADDRESS=127.0.0.1 verin.
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:80"
    environment:
      # Yalnızca kullanıcılar ilk oluşturulurken kullanılır (.env dosyasından gelir).
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:3000}
    volumes:
      - data:/data

volumes:
  data:
