name: trello-demo

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Giriş ekranı olmadığı için varsayılan olarak yalnızca bu bilgisayardan erişilir.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
    volumes:
      - data:/data

volumes:
  data:
